  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<script src=\"e648d018-6a56-41d9-802d-8de48098da8a\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n  <link rel=\"icon\" type=\"image/png\" href=\"8a9a23a5-f7e0-42b8-915c-c73713c2454a\">\n  <style>\n    body { margin: 0; }\n    a { color: #0047BB; }\n    a:hover { color: #00CE7E; }\n    input, textarea { font-family: inherit; }\n    ::placeholder { color: #9a9a9a; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; color:#2c2c2c; background:#ffffff; width:100%;\">\n\n  <!-- Nav -->\n  <div style=\"position:sticky; top:0; z-index:20; background:#ffffff; border-bottom:1px solid #ececec; display:flex; align-items:center; justify-content:space-between; padding:16px 48px;\">\n    <img src=\"9589707c-94a1-4678-aff6-1cd1b6037b50\" alt=\"Elm Design Group\" style=\"height:60px; width:auto;\">\n    <div style=\"display:flex; align-items:center; gap:32px;\">\n      <a href=\"#services\" style=\"text-decoration:none; font-size:14px; font-weight:600; color:#2c2c2c;\">Services<\u002Fa>\n      <a href=\"#sectors\" style=\"text-decoration:none; font-size:14px; font-weight:600; color:#2c2c2c;\">Sectors<\u002Fa>\n      <a href=\"#community\" style=\"text-decoration:none; font-size:14px; font-weight:600; color:#2c2c2c;\">Community<\u002Fa>\n      <a href=\"#offices\" style=\"text-decoration:none; font-size:14px; font-weight:600; color:#2c2c2c;\">Offices<\u002Fa>\n      <a href=\"#contact\" style=\"text-decoration:none; background:#0047BB; color:#ffffff; font-size:14px; font-weight:700; padding:10px 20px; border-radius:4px;\">Get a Quote<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Hero -->\n  <div style=\"padding:96px 48px 88px 48px; text-align:center; background:linear-gradient(180deg,#F7F9FC 0%,#ffffff 100%);\">\n    <div style=\"font-size:13px; font-weight:700; color:#0047BB; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:18px;\">Architecture · Engineering · Construction Management<\u002Fdiv>\n    <h1 style=\"font-size:52px; font-weight:800; color:#1a1a1a; line-height:1.15; margin:0 0 22px 0; max-width:820px; margin-left:auto; margin-right:auto;\">Design &amp; Construction Delivery, Built to Last<\u002Fh1>\n    <p style=\"font-size:18px; line-height:1.6; color:#5a5a5a; max-width:640px; margin:0 auto 36px auto;\">\n      Elm Design Group partners with clients across Ontario — from industrial and commercial developers to Northern and Indigenous communities — to deliver projects from concept through commissioning.\n    <\u002Fp>\n    <div style=\"display:flex; gap:16px; justify-content:center;\">\n      <a href=\"#contact\" style=\"text-decoration:none; background:#0047BB; color:#ffffff; font-size:15px; font-weight:700; padding:14px 30px; border-radius:4px;\">Request a Quote<\u002Fa>\n      <a href=\"#services\" style=\"text-decoration:none; background:#ffffff; color:#0047BB; border:2px solid #0047BB; font-size:15px; font-weight:700; padding:12px 28px; border-radius:4px;\">Our Services<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Services -->\n  <div id=\"services\" style=\"padding:88px 48px; max-width:1180px; margin:0 auto;\">\n    <div style=\"text-align:center; margin-bottom:56px;\">\n      <div style=\"font-size:13px; font-weight:700; color:#0047BB; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:12px;\">What We Do<\u002Fdiv>\n      <h2 style=\"font-size:34px; font-weight:800; color:#1a1a1a; margin:0;\">Full-Service Delivery, One Team<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:32px;\">\n\n      <div style=\"padding:28px; border:1px solid #ececec; border-radius:6px;\">\n        <div style=\"width:40px; height:5px; background:#00CE7E; border-radius:3px; margin-bottom:18px;\"><\u002Fdiv>\n        <div style=\"font-size:18px; font-weight:700; color:#1a1a1a; margin-bottom:8px;\">Architecture<\u002Fdiv>\n        <div style=\"font-size:14.5px; line-height:1.55; color:#5a5a5a;\">Conceptual design through construction documents, shaping spaces for residential, commercial, and community clients.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:28px; border:1px solid #ececec; border-radius:6px;\">\n        <div style=\"width:40px; height:5px; background:#00CE7E; border-radius:3px; margin-bottom:18px;\"><\u002Fdiv>\n        <div style=\"font-size:18px; font-weight:700; color:#1a1a1a; margin-bottom:8px;\">Engineering<\u002Fdiv>\n        <div style=\"font-size:14.5px; line-height:1.55; color:#5a5a5a;\">Complete engineering services tailored to project size and requirements, across industrial, residential, and commercial work.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:28px; border:1px solid #ececec; border-radius:6px;\">\n        <div style=\"width:40px; height:5px; background:#00CE7E; border-radius:3px; margin-bottom:18px;\"><\u002Fdiv>\n        <div style=\"font-size:18px; font-weight:700; color:#1a1a1a; margin-bottom:8px;\">Construction Management<\u002Fdiv>\n        <div style=\"font-size:14.5px; line-height:1.55; color:#5a5a5a;\">Remote or on-site oversight to maintain budget and schedule across industrial, construction, and community projects.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:28px; border:1px solid #ececec; border-radius:6px;\">\n        <div style=\"width:40px; height:5px; background:#00CE7E; border-radius:3px; margin-bottom:18px;\"><\u002Fdiv>\n        <div style=\"font-size:18px; font-weight:700; color:#1a1a1a; margin-bottom:8px;\">Detailed Design &amp; Analysis<\u002Fdiv>\n        <div style=\"font-size:14.5px; line-height:1.55; color:#5a5a5a;\">Advanced architectural, mechanical, and structural design, with multidisciplinary teams for complex scopes.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:28px; border:1px solid #ececec; border-radius:6px;\">\n        <div style=\"width:40px; height:5px; background:#00CE7E; border-radius:3px; margin-bottom:18px;\"><\u002Fdiv>\n        <div style=\"font-size:18px; font-weight:700; color:#1a1a1a; margin-bottom:8px;\">Inspection &amp; Commissioning<\u002Fdiv>\n        <div style=\"font-size:14.5px; line-height:1.55; color:#5a5a5a;\">On-site and remote personnel guide implementation, commissioning, inspection, and audit reporting.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:28px; border:1px solid #ececec; border-radius:6px;\">\n        <div style=\"width:40px; height:5px; background:#00CE7E; border-radius:3px; margin-bottom:18px;\"><\u002Fdiv>\n        <div style=\"font-size:18px; font-weight:700; color:#1a1a1a; margin-bottom:8px;\">Site &amp; Infrastructure Development<\u002Fdiv>\n        <div style=\"font-size:14.5px; line-height:1.55; color:#5a5a5a;\">Large-scale planning from site services to structural design, supporting communities from the ground up.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div style=\"margin-top:40px; text-align:center; font-size:14px; font-weight:700; color:#4a4a4a; letter-spacing:0.03em;\">\n      Architectural · Civil · Structural · HVAC · Plumbing · Electrical · Water Treatment · Modular &amp; Rapid Housing\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Sectors -->\n  <div id=\"sectors\" style=\"background:#F7F9FC; padding:88px 48px;\">\n    <div style=\"max-width:1180px; margin:0 auto;\">\n      <div style=\"text-align:center; margin-bottom:56px;\">\n        <div style=\"font-size:13px; font-weight:700; color:#0047BB; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:12px;\">Who We Serve<\u002Fdiv>\n        <h2 style=\"font-size:34px; font-weight:800; color:#1a1a1a; margin:0;\">Sectors We Serve<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:24px;\">\n        <div style=\"background:#ffffff; border-radius:6px; padding:28px 20px; text-align:center;\">\n          <div style=\"font-size:16px; font-weight:700; color:#1a1a1a;\">Industrial<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff; border-radius:6px; padding:28px 20px; text-align:center;\">\n          <div style=\"font-size:16px; font-weight:700; color:#1a1a1a;\">Residential<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff; border-radius:6px; padding:28px 20px; text-align:center;\">\n          <div style=\"font-size:16px; font-weight:700; color:#1a1a1a;\">Commercial<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff; border-radius:6px; padding:28px 20px; text-align:center;\">\n          <div style=\"font-size:16px; font-weight:700; color:#1a1a1a;\">Government &amp; Municipal<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Community -->\n  <div id=\"community\" style=\"padding:88px 48px;\">\n    <div style=\"max-width:1000px; margin:0 auto; display:flex; gap:56px; align-items:center;\">\n      <div style=\"flex-shrink:0; width:180px; height:180px; border-radius:50%; background:#0047BB; display:flex; align-items:center; justify-content:center; flex-direction:column;\">\n        <div style=\"font-size:34px; font-weight:800; color:#ffffff;\">2016<\u002Fdiv>\n        <div style=\"font-size:11px; font-weight:700; color:#BFD4F5; text-transform:uppercase; letter-spacing:0.06em; margin-top:4px;\">Since<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px; font-weight:700; color:#0047BB; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:12px;\">Community Partnerships<\u002Fdiv>\n        <h2 style=\"font-size:30px; font-weight:800; color:#1a1a1a; margin:0 0 16px 0;\">Building Communities Since 2016<\u002Fh2>\n        <p style=\"font-size:15.5px; line-height:1.65; color:#4a4a4a; margin:0;\">\n          We collaborate closely with community leaders across Ontario — including Indigenous and First Nations partners — to deliver housing, health, and cultural facilities that meet the technical demands of the project while respecting the needs of the people it serves.\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Offices -->\n  <div id=\"offices\" style=\"background:#F7F9FC; padding:88px 48px;\">\n    <div style=\"max-width:1000px; margin:0 auto;\">\n      <div style=\"text-align:center; margin-bottom:56px;\">\n        <div style=\"font-size:13px; font-weight:700; color:#0047BB; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:12px;\">Where We Are<\u002Fdiv>\n        <h2 style=\"font-size:34px; font-weight:800; color:#1a1a1a; margin:0;\">Office Locations<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:32px;\">\n\n        <div style=\"background:#ffffff; border-radius:6px; padding:32px; display:flex; gap:20px; align-items:flex-start;\">\n          <div style=\"width:14px; height:14px; border-radius:50%; background:#00CE7E; margin-top:4px; flex-shrink:0;\"><\u002Fdiv>\n          <div>\n            <div style=\"font-size:18px; font-weight:700; color:#1a1a1a; margin-bottom:6px;\">Sudbury<\u002Fdiv>\n            <div style=\"font-size:14.5px; color:#5a5a5a; line-height:1.5;\">73 Elm Street<br>Sudbury, ON P3C 1R6<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#ffffff; border-radius:6px; padding:32px; display:flex; gap:20px; align-items:flex-start;\">\n          <div style=\"width:14px; height:14px; border-radius:50%; background:#00CE7E; margin-top:4px; flex-shrink:0;\"><\u002Fdiv>\n          <div>\n            <div style=\"font-size:18px; font-weight:700; color:#1a1a1a; margin-bottom:6px;\">Timmins<\u002Fdiv>\n            <div style=\"font-size:14.5px; color:#5a5a5a; line-height:1.5;\">172 Algonquin Blvd E<br>Timmins, ON P4N 1A9<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Contact -->\n  <div id=\"contact\" style=\"padding:88px 48px;\">\n    <div style=\"max-width:1000px; margin:0 auto; display:grid; grid-template-columns:1fr 1.3fr; gap:56px;\">\n\n      <div>\n        <div style=\"font-size:13px; font-weight:700; color:#0047BB; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:12px;\">Get In Touch<\u002Fdiv>\n        <h2 style=\"font-size:32px; font-weight:800; color:#1a1a1a; margin:0 0 20px 0;\">Request a Quote<\u002Fh2>\n        <p style=\"font-size:15px; line-height:1.6; color:#5a5a5a; margin:0 0 28px 0;\">\n          Tell us about your project and a member of our team will follow up shortly.\n        <\u002Fp>\n        <div style=\"margin-bottom:16px;\">\n          <div style=\"font-size:11px; font-weight:700; color:#9a9a9a; text-transform:uppercase; letter-spacing:0.06em;\">Phone<\u002Fdiv>\n          <div style=\"font-size:15px; font-weight:600; color:#1a1a1a;\">705-885-9040<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px; font-weight:700; color:#9a9a9a; text-transform:uppercase; letter-spacing:0.06em;\">Email<\u002Fdiv>\n          <div style=\"font-size:15px; font-weight:600; color:#1a1a1a;\">sales@elm.ca<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#F7F9FC; border-radius:8px; padding:36px;\">\n        <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center; padding:40px 0;\">\n            <div style=\"font-size:20px; font-weight:800; color:#0047BB; margin-bottom:8px;\">Thank you!<\u002Fdiv>\n            <div style=\"font-size:14.5px; color:#5a5a5a;\">Your request has been received. We'll be in touch soon.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; flex-direction:column; gap:16px;\">\n            <div>\n              <label style=\"font-size:12px; font-weight:700; color:#5a5a5a; display:block; margin-bottom:6px;\">Name<\u002Flabel>\n              <input type=\"text\" placeholder=\"Your name\" value=\"{{ name }}\" sc-camel-on-change=\"{{ onNameChange }}\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid #d8dce2; border-radius:4px; font-size:14px;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"font-size:12px; font-weight:700; color:#5a5a5a; display:block; margin-bottom:6px;\">Email<\u002Flabel>\n              <input type=\"email\" placeholder=\"you@company.com\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmailChange }}\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid #d8dce2; border-radius:4px; font-size:14px;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"font-size:12px; font-weight:700; color:#5a5a5a; display:block; margin-bottom:6px;\">Organization<\u002Flabel>\n              <input type=\"text\" placeholder=\"Company or community\" value=\"{{ org }}\" sc-camel-on-change=\"{{ onOrgChange }}\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid #d8dce2; border-radius:4px; font-size:14px;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"font-size:12px; font-weight:700; color:#5a5a5a; display:block; margin-bottom:6px;\">Project Details<\u002Flabel>\n              <textarea placeholder=\"Tell us about your project\" rows=\"4\" value=\"{{ message }}\" sc-camel-on-change=\"{{ onMessageChange }}\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid #d8dce2; border-radius:4px; font-size:14px; resize:vertical;\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onSubmit }}\" style=\"background:#0047BB; color:#ffffff; border:none; font-size:15px; font-weight:700; padding:13px 24px; border-radius:4px; cursor:pointer;\">Submit Request<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Footer -->\n  <div style=\"background:#0047BB; padding:48px; display:flex; align-items:center; justify-content:space-between;\">\n    <img src=\"7244bc74-ad63-4d0f-8af1-f2ba9ab455e2\" alt=\"Elm Design Group\" style=\"height:30px; width:auto;\">\n    <div style=\"font-size:13px; color:#cfe0f9; text-align:right;\">\n      705-885-9040 &nbsp;·&nbsp; sales@elm.ca &nbsp;·&nbsp; www.elm.ca<br>\n      © 2026 Elm Design Group Ltd. All rights reserved.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { name: '', email: '', org: '', message: '', submitted: false };\n\n  renderVals() {\n    return {\n      name: this.state.name,\n      email: this.state.email,\n      org: this.state.org,\n      message: this.state.message,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      onNameChange: (e) => this.setState({ name: e.target.value }),\n      onEmailChange: (e) => this.setState({ email: e.target.value }),\n      onOrgChange: (e) => this.setState({ org: e.target.value }),\n      onMessageChange: (e) => this.setState({ message: e.target.value }),\n      onSubmit: () => this.setState({ submitted: true }),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
